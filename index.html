<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lavender Sky | Music Producer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <main class="container">
        <!-- Logo Section -->
        <header class="logo-section">
            <img src="logo_placeholder.png" alt="Lavender Sky Logo" class="logo">
        </header>

        <!-- Profile Section -->
        <section class="profile-section">
            <div class="profile-img-container">
                <img src="profile_placeholder.png" alt="Producer Profile" class="profile-img">
            </div>
            <h1 class="producer-name">LAVENDER SKY</h1>
            <p class="tagline">Beats that transcend gravity.</p>
        </section>

        <!-- Introduction Section -->
        <section class="intro-section">
            <p>
                Crafting sonic landscapes that blur the lines between reality and dreams. 
                Specializing in Lo-Fi, Synthwave, and Future Bass. Let's create something timeless.
            </p>
        </section>

        <!-- Showcase Section -->
        <section class="showcase-section">
            <h2>Latest Release</h2>
            <div class="video-wrapper">
                <!-- Placeholder YouTube Video (Lo-Fi Beats to create to) -->
                <iframe width="560" height="315" src="https://www.youtube.com/embed/jfKfPfyJRdk?controls=0" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            </div>
        </section>

        <!-- Contact Section -->
        <section class="contact-section">
            <h2>Get In Touch</h2>
            <form id="contact-form">
                <div class="form-group">
                    <input type="text" id="name" placeholder="Your Name" required>
                </div>
                <div class="form-group">
                    <input type="email" id="email" placeholder="Your Email" required>
                </div>
                <div class="form-group">
                    <textarea id="message" rows="4" placeholder="Your Message" required></textarea>
                </div>
                <button type="submit" class="cta-button">SEND MESSAGE</button>
            </form>
        </section>
        
        <footer class="footer">
            <p>&copy; 2026 Lavender Sky. All rights reserved.</p>
        </footer>
    </main>

    <script src="script.js"></script>
</body>
</html>
